version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "./queries/food"
      - "./queries/restaurant"
      - "./queries/employee"
      - "./queries/tables"
      - "./queries/food_orders"
      - "./queries/payments"
      - "./queries/chat_messages"
      - "./queries/homepage"
    schema: "./migrations"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false